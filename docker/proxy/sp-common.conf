# StackPanel 反代共享片段（nginx）—— 三份模板共用的唯一真源。
#
# 为什么单独成文件：模板里的前缀列表一旦在两个地方各写一份，就一定会漂移。这次
# 事故的形态正是「列表写在正则 location 里，被面板的 `^~ /` 静默吞掉」，而没有人
# 能在两份不一致的配置里看出到底哪份生效。
#
# 用法（在站点配置的 `server { }` 内部，**Web 兜底 location 之前**）：
#
#     include /etc/nginx/sp-common.conf;
#     location / { proxy_pass http://stackpanel_web; ... }
#
# 或者直接整份文件复制（模板只该是「复制即可用」，不强制要求落地额外文件）。
#
# ============================================================================
# 为什么全部用 `^~` 而不是正则 —— 这是「插件前端 404」的根治
# ============================================================================
#
# nginx 的路由优先级是：`=` > `^~`（最长前缀，命中即止） > 正则 `~`/`~*`（按文件
# 出现顺序） > 普通前缀（最长匹配）。
#
# 1Panel / 宝塔 / 群晖这类面板**必定**生成一条 `location ^~ / { include proxy/*; }`。
# 只要它存在，文件里所有 `location ~ ^/(api/v1|mcp|…)$` 正则**永远不会被尝试**
# —— 而且没有任何告警。症状是：页面完全正常，但 `/api/v1/*`、`/themes/*`、
# `/plugins/*`（插件前端）、`/callbacks/*`（支付回调）全部落到 Web 上游 → 404，
# 看起来像「插件坏了」，实际是路由没命中。
#
# 换成 `^~` 之后，这些规则与面板的 `^~ /` 属于同一类，走**最长前缀**比较：
# `^~ /api/` 比 `^~ /` 更长，所以照样优先。这就是为什么本文件里一条正则都没有。

# ---------------------------------------------------------------------------
# 对外协议：**不要写 `$scheme`**
#
# `$scheme` 是 nginx 自己这一跳的协议。CDN / 面板 / 云 LB 终止 TLS 后回源到
# `listen 80` 时它永远是 `http`，而浏览器 `Origin` 是 `https://…`。Web BFF 的同源
# 守卫（`apps/web/src/lib/request-origin.ts`）比对不上就 403 —— 界面显示
# 「请求来源无效」，**后台所有 POST 全部失效**（GET 不受影响，所以页面看着是好的）。
#
# 优先透传上游写好的 `X-Forwarded-Proto`（CDN 会写）；没有时才兜底。
# __SP_EDGE_PROTO__ 由 `scripts/proxy-config.mjs` 替换：
#   - 源站纯 http 对外（无 TLS）  →  $scheme
#   - TLS 在本机 nginx 终止       →  $scheme
#   - TLS 在 CDN/面板终止（最常见）→  https
#   - 透传模式（信任上游已给值）   →  $http_x_forwarded_proto
# ---------------------------------------------------------------------------
map $http_x_forwarded_proto $sp_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      __SP_EDGE_PROTO__;
}

# 对外端口同理：`$server_port` 是回源端口（80），不是访客看到的 443。有些同源
# 判断与重定向会把端口算进去，端口错了会得到 `https://host:80/…` 这种地址。
map $http_x_forwarded_port $sp_forwarded_port {
    default $http_x_forwarded_port;
    ''      443;
}

# WebSocket（插件前端热更新、部分流式接口）。
map $http_upgrade $sp_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream stackpanel_web {
    server __SP_WEB_UPSTREAM__;
    keepalive 16;
}

upstream stackpanel_api {
    server __SP_API_UPSTREAM__;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# 真实客户端 IP（`set_real_ip_from`）
#
# 前面还有 CDN / 云 LB / 面板的反代容器时**必须**写它们的回源网段：否则内核看到的
# 所有访客都是同一个 IP，按 IP 的限流、验证码冷却、封禁、审计与登录日志全部失真
# —— 症状是「整站被限流」「换个浏览器也提示频繁」，几乎不可能联想到反代。
#
# __SP_REAL_IP_FROM__ 由 `scripts/proxy-config.mjs` 按所选拓扑替换：
#   - 反代与内核同机 / 同一 docker 网络：留空即可（对端本身就是私网，客户端 IP 由
#     `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for` 正确追加）
#   - 前面还有 CDN：展开成各家官方回源 CIDR（`--cdn cloudflare`）
#   - 内网 SLB / 1Panel 反代容器：写成它的网段（如 172.18.0.0/16）
#
# `real_ip_recursive on` 从右往左解析 X-Forwarded-For，与内核 `API_TRUST_PROXY`
# 的方向一致：左边可以伪造，右边才可信。
# ---------------------------------------------------------------------------
__SP_REAL_IP_FROM__

# ---------------------------------------------------------------------------
# API：机器面。前缀必须**原样保留**
#
# `proxy_pass http://stackpanel_api;` 不带 URI，所以路径原封不动转发
# （`/api/v1/platform` → 上游 `/api/v1/platform`）。写成 `proxy_pass http://upstream/;`
# 会剥掉匹配到的前缀，全部 404。
# ---------------------------------------------------------------------------

# 内核：`/api/v1/*`。**内核的全部路由都在 `/api/v1/` 下**；`/api/` 下不带 v1 的
# 路径都是 Web 的路由处理器 —— 所以这一条必须显式写，不能靠 `/api/` 兜底碰运气。
location ^~ /api/v1/              { __SP_PROXY_API__ }

# Web BFF 占用的 `/api/` 子前缀（`apps/web/src/app/api/*/route.ts`）。更长的前缀
# 天然赢过 `/api/`；逐条列出是为了可审计：新增 BFF 路由时看一眼就知道要不要加。
location ^~ /api/account/avatar      { __SP_PROXY_WEB__ }
location ^~ /api/action-flash        { __SP_PROXY_WEB__ }
location ^~ /api/admin/notifications {
    __SP_PROXY_WEB__
}
location ^~ /api/agent/              { __SP_PROXY_WEB__ }
location ^~ /api/frontend-abi/       { __SP_PROXY_WEB__ }
location ^~ /api/notifications       { __SP_PROXY_WEB__ }
location ^~ /api/plugins/            { __SP_PROXY_WEB__ }
location ^~ /api/store/              { __SP_PROXY_WEB__ }

# 其余 `/api/*`：只有 BFF 会到这里（转发到 API 只会 404）。
location ^~ /api/                    { __SP_PROXY_WEB__ }

# API 的非 `/api/` 前缀。少写一个就会出现「某类资源 404」，且页面本身是好的：
#   /mcp /sp/v1            开放平台（MCP 传输层、SP v1 兼容层）
#   /llm-gateway           LLM 网关（SSE 流式）
#   /callbacks             支付回调（第三方直连，不经浏览器）
#   /zjmf_api_login        智简魔方兼容登录
#   /cart /host /provision 商店 / 主机 / 开通
#   /themes /plugins /media 主题与插件前端资产、媒体文件（404 事故重灾区）
#   /platform              平台信息
#   /health /ready /version 探针与构建身份
location ^~ /mcp                 { __SP_PROXY_API__ }
location ^~ /sp/                 { __SP_PROXY_API__ }
location ^~ /llm-gateway/        { __SP_PROXY_API__ }
location ^~ /callbacks/          { __SP_PROXY_API__ }
location ^~ /zjmf_api_login      { __SP_PROXY_API__ }
location ^~ /cart/               { __SP_PROXY_API__ }
location ^~ /host/               { __SP_PROXY_API__ }
location ^~ /provision/          { __SP_PROXY_API__ }
location ^~ /themes/             { __SP_PROXY_API__ }
location ^~ /plugins/            { __SP_PROXY_API__ }
location ^~ /media/              { __SP_PROXY_API__ }
location ^~ /platform/           { __SP_PROXY_API__ }
location ^~ /health              { __SP_PROXY_API__ }
location ^~ /ready               { __SP_PROXY_API__ }
location ^~ /version             { __SP_PROXY_API__ }
