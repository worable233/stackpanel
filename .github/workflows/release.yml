# 该文件由 IMG-DIST 流维护：内核镜像发布（GHCR + tag + Release Notes + cosign）。
name: Release

# 触发：
# - 推送 v* 标签：构建 / 推送 / 签名 / 建 Release（自动生成 Release Notes）。
# - 手工触发：只构建 / 推送 / 签名（不建 Release），用于补发或重签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像版本标签（形如 v1.2.3）；仅用于元数据，不创建 Release'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stackpanel

jobs:
  publish:
    name: 构建 · 推送 · 签名 · 发布
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出（含全部历史，供 Release Notes 生成）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GHCR 要求命名空间全小写；仓库所有者可能含大写，这里统一归一。
      - name: 解析镜像命名空间
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（多架构）
        uses: docker/setup-qemu-action@v4

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本标签由 semver 派生：1.2.3 / 1.2 / 1（v 标签）；latest 只给正式版。
      - name: 计算镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=StackPanel
            org.opencontainers.image.description=自托管的数字商品与主机业务系统（api / web / worker 同一镜像，靠入口脚本区分）
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT AND LGPL-3.0-or-later AND MPL-2.0 AND EPL-2.0 AND AGPL-3.0 AND CC-BY-4.0 AND CC-BY-3.0 AND ODC-By-1.0

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 同时推送 SBOM 与 SLSA 来源证明（OCI attestation）。
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3

      # keyless：用 GitHub OIDC 身份签名，无需长期私钥，签名可从 Sigstore 透明日志审计。
      - name: 签名镜像摘要（keyless）
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: 签名自检
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST_REF"

      - name: 写入工作流摘要
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## 已发布镜像'
            echo
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            echo "- 摘要：\`${{ steps.build.outputs.digest }}\`"
            echo "- 验签：\`bash scripts/verify-image.sh $IMAGE_DIGEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 生成并签名内核版本清单（§3.2、§13-4）。清单声明多架构镜像 digest、最低
      # updater 协议、允许升级来源、迁移路径、schema 范围与平台。用受保护环境的
      # `KERNEL_MANIFEST_SIGNING_KEY`（Ed25519 私钥）签名；无该密钥时**跳过**并告警，
      # 不发布未签名内核清单（生产自动更新不允许跳过验签）。
      - name: Setup pnpm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm install --frozen-lockfile

      - name: 生成并签名内核版本清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}
          SIGNING_KEY: ${{ secrets.KERNEL_MANIFEST_SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ vars.KERNEL_MANIFEST_SIGNING_KEY_ID }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_KEY_ID" ]; then
            echo "::warning::缺少 KERNEL_MANIFEST_SIGNING_KEY(_ID)，跳过内核清单发布（生产必须配置）"
            exit 0
          fi
          if [ -z "${{ vars.KERNEL_DATABASE_MIGRATION }}" ]; then
            echo "::error::缺少 KERNEL_DATABASE_MIGRATION（本次发布所需的数据库迁移标识）；拒绝发布含空迁移的内核清单"
            exit 1
          fi
          mkdir -p kernel-out
          printf '%s' "$SIGNING_KEY" > kernel-signing.pem
          IMAGE_REF="$IMAGE_REPOSITORY@${{ steps.build.outputs.digest }}"
          cat > kernel.meta.json <<EOF
          {
            "kind": "kernel",
            "version": "${GITHUB_REF_NAME#v}",
            "channel": "${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}",
            "kernelApi": "${{ vars.KERNEL_API_VERSION || '0.4.0' }}",
            "frontendAbi": "1.0.0",
            "updateProtocol": 1,
            "upgradeFrom": "${{ vars.KERNEL_UPGRADE_FROM || '>=0.1.0' }}",
            "migrationPath": "direct",
            "schemaRange": "${{ vars.KERNEL_SCHEMA_RANGE || '*' }}",
            "images": [
              { "platform": "linux/amd64", "digest": "$IMAGE_REF" },
              { "platform": "linux/arm64", "digest": "$IMAGE_REF" }
            ],
            "corePackages": [],
            "supportedPlatforms": ["linux/amd64","linux/arm64"],
            "smokeProbeVersion": 1,
            "databaseMigration": "${{ vars.KERNEL_DATABASE_MIGRATION || '' }}",
            "source": {
              "repository": "${{ github.repository }}",
              "tag": "${{ github.ref_name }}",
              "asset": "kernel-manifest.json"
            }
          }
          EOF
          pnpm --filter @stackpanel/spec build
          node scripts/release/build-kernel-manifest.mjs \
            --input kernel.meta.json \
            --key-file kernel-signing.pem \
            --key-id "$SIGNING_KEY_ID" \
            --out kernel-out
          rm -f kernel-signing.pem

      - name: 上传内核清单产物
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('kernel-out/kernel-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kernel-manifest
          path: |
            kernel-out/kernel-manifest.json
            kernel-out/kernel-manifest.sig
            kernel-out/kernel-ref.json

      # 把已签名内核清单作为 Release 资产发布（§13-4）。目录只引用该资产的摘要与 keyId。
      - name: 发布内核清单资产
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('kernel-out/kernel-manifest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            kernel-out/kernel-manifest.json
            kernel-out/kernel-manifest.sig

      # 生成 GitHub Release（Release Notes 由提交历史自动汇总）。内核清单资产已在上一步
      # 以相同 tag 发布，会被 GitHub 合并到同一 Release。
      - name: 生成 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## 容器镜像

            - 镜像：`${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}`
            - 摘要：`${{ steps.build.outputs.digest }}`
            - 平台：`linux/amd64`、`linux/arm64`

            镜像标签（同一次发布）：

            ```
            ${{ steps.meta.outputs.tags }}
            ```

            ## 拉取与验签（cosign keyless）

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
            ```

            还附带了 SBOM 与 SLSA 来源证明，可用 `cosign download sbom` / `cosign verify-attestation` 获取。

            ## 部署

            使用已发布镜像（不本地构建）：

            ```bash
            STACKPANEL_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            bash scripts/deploy.sh --image "$STACKPANEL_IMAGE"
            ```

            详见 [`docker/README.md`](https://github.com/${{ github.repository }}/blob/main/docker/README.md)。
