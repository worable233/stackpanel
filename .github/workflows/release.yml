# 该文件由 IMG-DIST 流维护：内核镜像发布（GHCR + tag + Release Notes + cosign）。
name: Release

# 触发：
# - 推送 v* 标签：构建 / 推送 / 签名 / 建 Release（自动生成 Release Notes）。
# - 手工触发：只构建 / 推送 / 签名（不建 Release），用于补发或重签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像版本标签（形如 v1.2.3）；仅用于元数据，不创建 Release'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stackpanel
  # 镜像构建的目标平台。默认**只** linux/amd64。
  #
  # 为什么去掉 arm64：它走 QEMU 全量模拟，实测把单次发布从 ~15 分钟拖到
  # 50+ 分钟，而绝大多数自托管部署是 x86_64。arm64 可以按需开启：
  # 在仓库变量里设 `KERNEL_PLATFORMS=linux/amd64,linux/arm64` 即可恢复，
  # 内核清单的 images / supportedPlatforms 会跟着这个值走，不会出现
  # 「清单声称支持 arm64 但镜像里没有」的错配。
  KERNEL_PLATFORMS: ${{ vars.KERNEL_PLATFORMS || 'linux/amd64' }}

jobs:
  publish:
    name: 构建 · 推送 · 签名 · 发布
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出（含全部历史，供 Release Notes 生成）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GHCR 要求命名空间全小写；仓库所有者可能含大写，这里统一归一。
      - name: 解析镜像命名空间
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（多架构）
        uses: docker/setup-qemu-action@v4

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本标签由 semver 派生：1.2.3 / 1.2 / 1（v 标签）；latest 只给正式版。
      - name: 计算镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=StackPanel
            org.opencontainers.image.description=自托管的数字商品与主机业务系统（api / web / worker 同一镜像，靠入口脚本区分）
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT AND LGPL-3.0-or-later AND MPL-2.0 AND EPL-2.0 AND AGPL-3.0 AND CC-BY-4.0 AND CC-BY-3.0 AND ODC-By-1.0

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ env.KERNEL_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 镜像内写入 `RELEASE.json`（`GET /version` 的提交号来源）。版本取 tag，
          # 提交号取触发点——线上「容器里到底是哪次构建」不再靠行为猜。
          build-args: |
            STACKPANEL_VERSION=${{ steps.meta.outputs.version }}
            STACKPANEL_COMMIT=${{ github.sha }}
            STACKPANEL_BUILT_AT=${{ steps.meta.outputs.created }}
          # 同时推送 SBOM 与 SLSA 来源证明（OCI attestation）。
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3

      # keyless：用 GitHub OIDC 身份签名，无需长期私钥，签名可从 Sigstore 透明日志审计。
      - name: 签名镜像摘要（keyless）
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: 签名自检
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST_REF"

      - name: 写入工作流摘要
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## 已发布镜像'
            echo
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            echo "- 摘要：\`${{ steps.build.outputs.digest }}\`"
            echo "- 验签：\`bash scripts/verify-image.sh $IMAGE_DIGEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 生成并签名内核版本清单（§3.2、§13-4）。清单声明多架构镜像 digest、最低
      # updater 协议、允许升级来源、迁移路径、schema 范围与平台。用受保护环境的
      # `KERNEL_MANIFEST_SIGNING_KEY`（Ed25519 私钥）签名；无该密钥时**跳过**并告警，
      # 不发布未签名内核清单（生产自动更新不允许跳过验签）。
      - name: Setup pnpm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm install --frozen-lockfile

      - name: 生成并签名内核版本清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}
          SIGNING_KEY: ${{ secrets.KERNEL_MANIFEST_SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ vars.KERNEL_MANIFEST_SIGNING_KEY_ID }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_KEY_ID" ]; then
            echo "::warning::缺少 KERNEL_MANIFEST_SIGNING_KEY(_ID)，跳过内核清单发布（生产必须配置）"
            exit 0
          fi
          if [ -z "${{ vars.KERNEL_DATABASE_MIGRATION }}" ]; then
            echo "::error::缺少 KERNEL_DATABASE_MIGRATION（本次发布所需的数据库迁移标识）；拒绝发布含空迁移的内核清单"
            exit 1
          fi
          mkdir -p kernel-out
          # 产物载体（ADR-0025）：自包含 tar.zst 必须在签名前打好，摘要要并入清单。
          # 在 ubuntu runner 上构建，原生依赖天然是 linux-x64。
          # 先构建契约包：其余包与打包脚本都从 packages/spec/dist 消费类型与版本常量。
          pnpm --filter @stackpanel/spec build
          pnpm --filter @stackpanel/api build
          pnpm --filter @stackpanel/web build
          pnpm --filter @stackpanel/updater build
          node scripts/release/build-kernel-artifact.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --platform linux-x64 \
            --database-migration "${{ vars.KERNEL_DATABASE_MIGRATION }}" \
            --out kernel-out
          node scripts/release/build-upgrade-runner.mjs --out kernel-out
          printf '%s' "$SIGNING_KEY" > kernel-signing.pem
          IMAGE_REF="$IMAGE_REPOSITORY@${{ steps.build.outputs.digest }}"
          # 清单里的平台声明必须与**实际构建的平台**一致，否则 arm64 机器会拉到
          # 一个清单声称支持、实际没有的镜像。两边都从 KERNEL_PLATFORMS 派生，
          # 结构上排除漂移。
          PLATFORM_JSON="$(printf '%s' "$KERNEL_PLATFORMS" | tr ',' '\n' | sed '/^$/d' \
            | awk -v ref="$IMAGE_REF" 'NF {printf "%s{\"platform\":\"%s\",\"digest\":\"%s\"}", sep, $0, ref; sep=","}')"
          PLATFORM_LIST="$(printf '%s' "$KERNEL_PLATFORMS" | tr ',' '\n' | sed '/^$/d' \
            | awk 'NF {printf "%s\"%s\"", sep, $0; sep=","}')"
          cat > kernel.meta.json <<EOF
          {
            "kind": "kernel",
            "version": "${GITHUB_REF_NAME#v}",
            "channel": "${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}",
            "kernelApi": "${{ vars.KERNEL_API_VERSION || '0.4.0' }}",
            "frontendAbi": "1.0.0",
            "updateProtocol": 1,
            "upgradeFrom": "${{ vars.KERNEL_UPGRADE_FROM || '>=0.1.0' }}",
            "migrationPath": "direct",
            "schemaRange": "${{ vars.KERNEL_SCHEMA_RANGE || '*' }}",
            "images": [$PLATFORM_JSON],
            "corePackages": [],
            "supportedPlatforms": [$PLATFORM_LIST],
            "smokeProbeVersion": 1,
            "databaseMigration": "${{ vars.KERNEL_DATABASE_MIGRATION || '' }}",
            "source": {
              "repository": "${{ github.repository }}",
              "tag": "${{ github.ref_name }}",
              "asset": "kernel-manifest.json"
            }
          }
          EOF
          node scripts/release/build-kernel-manifest.mjs \
            --input kernel.meta.json \
            --key-file kernel-signing.pem \
            --key-id "$SIGNING_KEY_ID" \
            --artifacts kernel-out/stackpanel-${GITHUB_REF_NAME#v}-linux-x64.artifacts.json \
            --out kernel-out
          rm -f kernel-signing.pem

      - name: 上传内核清单产物
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('kernel-out/kernel-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kernel-manifest
          path: |
            kernel-out/kernel-manifest.json
            kernel-out/kernel-manifest.sig
            kernel-out/kernel-ref.json
            kernel-out/stackpanel-*.tar.zst
            kernel-out/stackpanel-upgrade*
            kernel-out/stackpanel-*.artifacts.json

      # 把已签名内核清单作为 Release 资产发布（§13-4）。目录只引用该资产的摘要与 keyId。
      # 产物载体（ADR-0025）：kernel/migrate tar.zst 与 runner 也作为同一 Release 的资产，
      # 清单里的 `artifacts[].url` 正是指向这些文件。
      # `kernel-ref.json` **必须**进 Release 资产：`publish-catalog.yml --kernels`
      # 要从 Release 下载它，才能把内核引用写进 catalog 的 `kernels[]`。
      # 早先只把它当 Actions artifact，于是目录永远没有内核引用 —— 实例的更新中心
      # 只能看到插件更新，永远看不到内核升级（v0.1.3 就是这样漏的）。
      - name: 发布内核清单与产物资产
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('kernel-out/kernel-manifest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            kernel-out/kernel-manifest.json
            kernel-out/kernel-manifest.sig
            kernel-out/kernel-ref.json
            kernel-out/stackpanel-*.tar.zst
            kernel-out/stackpanel-upgrade*
            kernel-out/stackpanel-*.artifacts.json

      # 生成 GitHub Release（Release Notes 由提交历史自动汇总）。内核清单资产已在上一步
      # 以相同 tag 发布，会被 GitHub 合并到同一 Release。
      - name: 生成 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## 容器镜像

            - 镜像：`${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}`
            - 摘要：`${{ steps.build.outputs.digest }}`
            - 平台：`linux/amd64`、`linux/arm64`
            - updater 镜像（同版本号，独立服务）：`${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/stackpanel-updater:${{ steps.meta.outputs.version }}`
              —— 由 `publish-updater.yml` 构建，签名身份是该工作流而非本工作流（`scripts/verify-image.sh`
              会按镜像名自动选对应的工作流身份）

            镜像标签（同一次发布）：

            ```
            ${{ steps.meta.outputs.tags }}
            ```

            ## 拉取与验签（cosign keyless）

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
            ```

            还附带了 SBOM 与 SLSA 来源证明，可用 `cosign download sbom` / `cosign verify-attestation` 获取。

            ## 部署

            使用已发布镜像（不本地构建）：

            ```bash
            STACKPANEL_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            bash scripts/deploy.sh --image "$STACKPANEL_IMAGE"
            ```

            详见 [`docker/README.md`](https://github.com/${{ github.repository }}/blob/main/docker/README.md)。

  # updater 是独立服务（唯一持有 docker.sock），镜像必须与内核**同号**，但绝不能和
  # 主镜像共用一条发布路径：主镜像的手工触发（workflow_dispatch）会把
  # `stackpanel:0.1.1` 这类版本标签重新指向一个新摘要，而已签名的内核清单里写死的
  # 是旧摘要，两边对不上就等于发布了一版没人能验过的镜像。所以 updater 单独成一份
  # 可复用工作流，这里只在标签发布时调起；补发走 `publish-updater.yml` 自己的
  # workflow_dispatch（只动 updater 镜像）。
  publish-updater:
    name: 构建 · 推送 · 签名（updater）
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish-updater.yml
    with:
      tag: ${{ github.ref_name }}
      latest: ${{ !contains(github.ref_name, '-') }}

  # 发布前冒烟（v0.1.0 / v0.1.1 的教训）：镜像推上去之后**拉下来**起一套 compose，
  # 按用户路径走一遍——首页静态资源、健康检查、无浏览器初始化管理员、从市场装一个
  # isolated 插件并激活、装一个主题后首页仍可渲染。那两版镜像的四个阻断缺陷（漏打
  # `.next/static`、插件子进程入口打错、首页 500、没有信任根）在构建机与单元测试里
  # 全绿，只有这一步能抓住。
  #
  # 跑在发布之后：失败不会撤销已推送的镜像，但会把这次发布标红，形成强制门禁。
  smoke:
    name: 冒烟（拉官方镜像起 compose）
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: 检出（冒烟脚本与 compose 文件按标签取）
        uses: actions/checkout@v7

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 登录 GHCR（镜像是私有包时必须）
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像引用
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "ref=${REGISTRY}/${owner}/${IMAGE_NAME}:${version}" >> "$GITHUB_OUTPUT"

      # 端口避开默认值：runner 上虽然通常空闲，但显式指定能避免与镜像自带的端口
      # 默认值耦合，也让失败日志里的地址可读。
      - name: 冒烟
        run: |
          node scripts/release/smoke-image.mjs \
            --image "${{ steps.image.outputs.ref }}" \
            --web-port 18000 \
            --api-port 18001
