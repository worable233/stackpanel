name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Install · License · Check · Build
    runs-on: ubuntu-latest
    # The external-plugin install (clone + pnpm install + build) added ~2 min to a
    # run that already peaked at ~15 min; keep a real margin so a slow runner does
    # not fail as a timeout and read like a code failure.
    timeout-minutes: 30

    # PostgreSQL + Redis are part of the runtime baseline (ADR-0017/0019).
    # Tests recreate a `stackpanel_test` database on this server; Redis is
    # unused at this stage but kept so later steps (S3+) need no workflow change.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stackpanel
          POSTGRES_PASSWORD: stackpanel
          POSTGRES_DB: stackpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackpanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://stackpanel:stackpanel@127.0.0.1:5432/stackpanel
      TEST_DATABASE_URL: postgresql://stackpanel:stackpanel@127.0.0.1:5432/stackpanel_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_0123456789
      SETTINGS_ENCRYPTION_KEY: ci_settings_key_at_least_32_characters_0123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backup/restore drill runs host-side `pg_dump` / `pg_restore` against
      # the `postgres:16` service below. `ubuntu-latest` now ships client 17,
      # whose dumps carry `SET transaction_timeout` — a GUC that does not exist
      # on a 16 server, so `pg_restore` fails the DR gate. Pin the client to the
      # server's major instead of letting the runner image decide.
      - name: Install PostgreSQL 16 client (DR gate parity)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          # Debian's `postgresql-client-common` keeps `/usr/bin/pg_dump` pointing
          # at the newest installed major. Force the 16 binaries onto PATH so the
          # drill cannot silently fall back to 17.
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: Production dependency vulnerability audit
        run: pnpm audit --prod --registry=https://registry.npmjs.org --audit-level high

      - name: Generate dependency SBOM
        run: pnpm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/stackpanel-sbom.json"

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: stackpanel-sbom
          path: ${{ runner.temp }}/stackpanel-sbom.json
          retention-days: 90

      # Any copyleft-family license must be documented in
      # scripts/check-licenses.mjs and THIRD-PARTY-NOTICES.md, or the build fails.
      - name: License check
        run: pnpm license:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ADR-0016 / PLAN-i18n-completion 阶段 0: refuse new unregistered UI
      # literals. The ratchet baseline may only shrink as copy migrates into the
      # message catalogs; a fresh literal fails the gate with file + line.
      - name: i18n literal gate
        run: pnpm i18n:check

      # ADR-0016 §5: every package catalog must declare the same key set and the
      # same {placeholders} in every locale, otherwise a missing translation
      # silently renders the key name on one language only.
      - name: i18n package catalogs
        run: pnpm i18n:packages

      # zh-TW / zh-HK are derived from the authored zh-CN catalog; a stale
      # Traditional file means the two disagree on copy or keys.
      - name: i18n Traditional Chinese catalogs
        run: pnpm i18n:hant:check

      # G2: refuse OpenAPI changes that break the committed contract snapshot
      # (removed routes/methods, newly required auth/params/body, dropped
      # response codes). Pure function of the capability registry — no DB.
      - name: Contract snapshot (breaking-change gate)
        run: pnpm --filter @stackpanel/api contract:snapshot -- --check

      # D13/D15: the publishable contract + SDK must actually pack, and their
      # versions must stay in lock-step with KERNEL_API_VERSION.
      - name: Package dry-run (spec + sdk)
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @stackpanel/spec --filter @stackpanel/sdk pack \
            --pack-destination "$RUNNER_TEMP/pack"
          ls -1 "$RUNNER_TEMP/pack"

      # ADR-0023 / PLAN-github-distribution-and-updates: the release-side catalog
      # signer and the kernel-side verifier must share one contract source. This
      # offline drill builds/signs a catalog + package with the real release
      # scripts and re-verifies with the same spec primitives, then injects
      # tampering/replay/expiry faults that must all be rejected. No GitHub
      # permission required, so the chain is gated on every PR.
      - name: Distribution rehearsal (sign + verify round-trip + faults)
        run: |
          pnpm --filter @stackpanel/spec build
          pnpm release:rehearse

      # §13-7: offline clean-machine update drill. Builds the updater with its
      # drill entry and drives the real engine + Compose adapter through the
      # nine-step success path and the §6 failure-recovery matrix with an
      # injected host-command runner. No Docker required; the real-Docker
      # clean-machine acceptance is a separate, host-gated run.
      - name: Updater drill (engine + compose adapter, no Docker)
        run: |
          pnpm --filter @stackpanel/updater build
          pnpm release:updater-drill

      # §13: the acceptance report re-runs both offline drills and prints the
      # per-row acceptance table with replayable commands and residual limits.
      # It never claims real-host rows passed; gated rows stay gated so the
      # evidence boundary is explicit on every CI run.
      - name: Acceptance report (offline rows only; gated rows stay gated)
        run: pnpm release:acceptance-report

      # `referral`, `ticket` and `invoice` are not kernel built-ins: their
      # authoritative source lives in the separate `stackpanel-plugins`
      # repository, so a bare kernel checkout cannot activate them and
      # `describe.skipIf(!installed)` turned their suites into skips — CI was
      # green while covering none of those plugins (HANDOFF §三·1).
      #
      # Fetch that repository as a sibling of this checkout (a step-level
      # `git clone` rather than `actions/checkout`, which refuses paths outside
      # the workspace), build it against *this* kernel and install the real
      # packages into `apps/api/data` before the tests run.
      #
      # Deliberately fatal: if the plugin repository stops building against this
      # kernel, CI must fail here rather than quietly shrink back to a green but
      # uncovered run.
      - name: Install external plugin packages (referral / ticket / invoice)
        run: |
          set -euo pipefail
          plugins="$RUNNER_WORKSPACE/stackpanel-plugins"
          rm -rf "$plugins"
          git clone --depth 1 https://github.com/worable233/stackpanel-plugins.git "$plugins"
          # The plugin workspace links kernel packages through `../StackPanel`
          # (see its pnpm-workspace.yaml overrides), so the kernel checkout has
          # to be reachable under that sibling name.
          ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_WORKSPACE/StackPanel"
          # The plugins compile against the kernel packages' *built* entries; a
          # bare checkout only has sources.
          pnpm --filter @stackpanel/spec --filter @stackpanel/sdk \
            --filter @stackpanel/ui --filter @stackpanel/net-guard build
          ( cd "$plugins" && pnpm install --frozen-lockfile )
          # A fresh checkout has no data directory at all, and the installer only
          # writes into data directories that already exist.
          mkdir -p apps/api/data
          for id in referral ticket invoice; do
            # A plugin's frontend is a separate workspace project whose only build
            # script is `build: tsup` — no `prepare` — so a fresh clone has no
            # `frontend/dist`. Installing the package without it leaves
            # `frontend/manifest.json` beside a missing entry, which the kernel
            # correctly reports as *not ready* (`GET /ready` → 503, and the
            # suites' own routes serve nothing). That is an incomplete install,
            # not merely unbuilt frontend assets.
            ( cd "$plugins/packages/plugins/$id/frontend" && pnpm run build )
            ( cd "$plugins/packages/plugins/$id" \
              && node ../../../scripts/install-into-kernel.mjs --kernel "$GITHUB_WORKSPACE" )
            # Do not let a silently-empty install turn the suites back into skips.
            test -f "apps/api/data/plugins/$id/manifest.json"
            test -f "apps/api/data/plugins/$id/frontend/dist/index.js"
          done

      - name: Test
        run: pnpm test

      # E-1: the DR path (backup -> verify-rejects-corruption -> restore ->
      # row-count match) was never gated. It only needs the Postgres service
      # above, so it runs on every PR instead of only in ad-hoc drills.
      - name: Backup/restore drill (DR gate)
        run: pnpm backup:drill

      - name: Build
        run: pnpm build
