# 该文件由 DIST-CONTRACT 流维护：市场目录快照的构建、签名与发布
# （PLAN-github-distribution-and-updates §12；ADR-0023 提议）。
#
# 目标仓库：默认 `worable233/stackpanel-plugins`（内核自带的默认远程源，见
# `apps/api/src/config/env.ts` 的 `DEFAULT_CATALOG_REPOSITORY`）。目录采用唯一
# Release tag `catalog-v1/<sequence>`，含 `catalog.json` + `catalog.sig`（Ed25519）。
# 目录只**引用**允许仓库/release/asset/摘要，不保存安装包。
#
# 实例发现目录的顺序是：先取仓库默认分支的 `channels.json`（渠道指针 → sequence），
# 再取 `catalog-v1/<sequence>` 的 catalog.json/catalog.sig。因此发布必须**同时**
# 提交 channels.json 到默认分支——只建 Release 而不更新指针，实例永远发现不了新目录。
#
# 为什么先交付本 workflow：§13 明确「未取得 GitHub 发布权限时先交付 workflows、签名
# 测试产物和本地完整演练」。因此：
# - `workflow_dispatch` 默认只**构建 + 签名 + 自检**，产出 artifact（不发布）；
# - 只有显式 `publish=true` 且备有受保护环境密钥时才真正建 Release 并更新渠道指针。
#
# 目录更新必须**串行化**：两个发布者不得覆盖同一 sequence（本 workflow 的
# concurrency 组 + sequence 单调校验共同保证）。
name: Publish Catalog

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: '目录 sequence（必须大于已发布最高值）'
        required: true
        type: number
      publish:
        description: '是否真正创建 Release 并发布（默认只构建 + 自检）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

# 目录更新串行化：同一时刻只允许一个目录发布运行。
concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  build-catalog:
    name: 构建 · 签名 · 自检
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 私钥来自受保护环境；未配置时本 job 仍可给出干跑产物（不发布）。
    environment: catalog-publishing
    steps:
      - name: 检出（主仓：提供发布脚本与契约单一来源）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建契约单一来源
        run: pnpm --filter @stackpanel/spec build

      # 签名私钥只在受保护环境中；干跑（无 secrets）时改用一次性的测试密钥，
      # 产物只用于演练，绝不对外发布。
      - name: 准备目录签名私钥
        env:
          CATALOG_KEY_PEM: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$CATALOG_KEY_PEM" ]; then
            printf '%s\n' "$CATALOG_KEY_PEM" > "$RUNNER_TEMP/keys/catalog.private.pem"
            chmod 600 "$RUNNER_TEMP/keys/catalog.private.pem"
            echo "REAL_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 CATALOG_SIGNING_KEY；使用临时测试密钥，仅产出演练目录（不发布）"
            npm_config_yes=true npx --yes tsx --version >/dev/null 2>&1 || true
            node -e "const{generateKeyPairSync}=require('node:crypto');const k=generateKeyPairSync('ed25519');require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/keys/catalog.private.pem', k.privateKey.export({type:'pkcs8',format:'pem'}))"
            echo "REAL_KEY=0" >> "$GITHUB_ENV"
          fi

      - name: 构建目录签名自检信任根
        if: env.REAL_KEY == '1'
        env:
          KEYRING_JSON: ${{ secrets.CATALOG_KEYRING }}
        run: |
          if [ -z "$KEYRING_JSON" ]; then
            echo "::error::已配置目录私钥但缺少 CATALOG_KEYRING（用于自检）"; exit 1
          fi
          printf '%s\n' "$KEYRING_JSON" > "$RUNNER_TEMP/keys/keyring.json"

      # 条目来源：由市场仓 PR 提供的清单（此处以主仓 `catalog/entries` 为例，
      # 实施时改为 checkout 市场仓的 entries 目录）。配置里的 sequence 必须来自
      # 本次运行输入，否则「发布 sequence N」会签出另一个序号的快照。
      - name: 构建并签名目录快照
        run: |
          mkdir -p "$RUNNER_TEMP/catalog/entries"
          cp -r catalog/entries/. "$RUNNER_TEMP/catalog/entries/" 2>/dev/null || true
          node -e '
            const fs = require("node:fs");
            const config = {
              sequence: Number(process.env.SEQUENCE),
              channels: ["stable", "beta"],
              ttlDays: Number(process.env.TTL_DAYS || 14),
              keyId: process.env.KEY_ID,
              repository: process.env.REPOSITORY,
              publishers: JSON.parse(process.env.PUBLISHERS || "[]"),
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + "/catalog/catalog.config.json", JSON.stringify(config, null, 2));
          '
          args=(--entries "$RUNNER_TEMP/catalog/entries" --config "$RUNNER_TEMP/catalog/catalog.config.json" --key-file "$RUNNER_TEMP/keys/catalog.private.pem" --out "$RUNNER_TEMP/out/catalog-v1/${{ inputs.sequence }}" --key-id "$KEY_ID")
          if [ -f "$RUNNER_TEMP/keys/keyring.json" ]; then
            args+=(--keyring "$RUNNER_TEMP/keys/keyring.json")
          fi
          node scripts/release/build-catalog.mjs "${args[@]}"
        env:
          SEQUENCE: ${{ inputs.sequence }}
          KEY_ID: ${{ secrets.CATALOG_KEY_ID || 'catalog-2026' }}
          REPOSITORY: ${{ secrets.CATALOG_REPOSITORY || 'worable233/stackpanel-plugins' }}
          PUBLISHERS: ${{ secrets.CATALOG_PUBLISHERS }}
          TTL_DAYS: ${{ secrets.CATALOG_TTL_DAYS }}

      # 回放保护：把本次 sequence 与**仓库里已发布的最高值**比较。不能拿本次输入当
      # 「已见最高值」——`isNewerSequence` 是严格大于，那样永远自比失败。
      - name: 读取已发布最高 sequence
        id: highest
        env:
          GH_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
          REPOSITORY: ${{ secrets.CATALOG_REPOSITORY || 'worable233/stackpanel-plugins' }}
        run: |
          highest=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/catalog-v1%2F" \
            --jq '[.[].ref | capture("catalog-v1/(?<n>[0-9]+)$").n | tonumber] | max // 0' 2>/dev/null || echo 0)
          echo "highest=${highest:-0}" >> "$GITHUB_OUTPUT"
          echo "已发布最高 sequence：${highest:-0}"

      - name: 回读校验（与实例端同一验证器）
        run: |
          if [ ! -f "$RUNNER_TEMP/keys/keyring.json" ]; then
            echo "::warning::干跑：跳过回读校验（需要真实 keyring）"
            exit 0
          fi
          node scripts/release/verify-catalog.mjs \
            --dir "$RUNNER_TEMP/out/catalog-v1/${{ inputs.sequence }}" \
            --keyring "$RUNNER_TEMP/keys/keyring.json" \
            --repository "${{ secrets.CATALOG_REPOSITORY || 'worable233/stackpanel-plugins' }}" \
            --highest "${{ steps.highest.outputs.highest }}"

      - name: 上传目录产物
        uses: actions/upload-artifact@v4
        with:
          name: catalog-v1-${{ inputs.sequence }}
          path: ${{ runner.temp }}/out/catalog-v1/${{ inputs.sequence }}/
          retention-days: 30

      # 发布到市场仓：把 catalog.json / catalog.sig 写进 **tag 指向的树**，并同时把
      # channels.json 提交到默认分支。
      #
      # 为什么不能用 `gh release create` 只传 asset：实例是按
      # `raw.githubusercontent.com/<repo>/catalog-v1/<seq>/catalog.json` 取文件的，
      # Release asset 不在 tag 的树里，raw 读不到——Release 建成功、实例却永远 404。
      # 因此这里用 Git Data API 造一个提交（树里含目录文件与渠道指针），再把 tag
      # 指过去、把默认分支快进到同一个提交。
      - name: 发布目录到市场仓（tag 树 + 渠道指针）
        if: ${{ inputs.publish && env.REAL_KEY == '1' }}
        env:
          GH_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
          SEQUENCE: ${{ inputs.sequence }}
          REPOSITORY: ${{ secrets.CATALOG_REPOSITORY || 'worable233/stackpanel-plugins' }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const repo = process.env.REPOSITORY;
          const sequence = process.env.SEQUENCE;
          const dir = `${process.env.RUNNER_TEMP}/out/catalog-v1/${sequence}`;
          const tag = `catalog-v1/${sequence}`;
          const gh = (args, input) =>
            execFileSync('gh', args, {
              encoding: 'utf8',
              input: input === undefined ? undefined : JSON.stringify(input),
            }).trim();

          // 1) 同 sequence 的 tag 已存在 → 拒绝（目录序号只能向前）。
          try {
            gh(['api', `repos/${repo}/git/ref/tags/${encodeURIComponent(tag)}`]);
            console.error(`::error::目录 tag 已存在：${tag}（禁止覆盖同一 sequence）`);
            process.exit(1);
          } catch {
            // 不存在是预期。
          }

          // 2) 目录公钥自检已在上一步完成；这里只负责把字节原样搬进仓库。
          const head = gh(['api', `repos/${repo}/git/ref/heads/main`, '--jq', '.object.sha']);
          const baseTree = gh(['api', `repos/${repo}/git/commits/${head}`, '--jq', '.tree.sha']);
          const blob = (file) =>
            gh(
              ['api', '-X', 'POST', `repos/${repo}/git/blobs`, '--input', '-', '--jq', '.sha'],
              {
                content: readFileSync(`${dir}/${file}`).toString('base64'),
                encoding: 'base64',
              },
            );

          const tree = gh(
            ['api', '-X', 'POST', `repos/${repo}/git/trees`, '--input', '-', '--jq', '.sha'],
            {
              base_tree: baseTree,
              tree: [
                { path: 'catalog.json', mode: '100644', type: 'blob', sha: blob('catalog.json') },
                { path: 'catalog.sig', mode: '100644', type: 'blob', sha: blob('catalog.sig') },
                { path: 'channels.json', mode: '100644', type: 'blob', sha: blob('channels.json') },
              ],
            },
          );
          const commit = gh(
            ['api', '-X', 'POST', `repos/${repo}/git/commits`, '--input', '-', '--jq', '.sha'],
            {
              message: `chore(catalog): publish signed catalog snapshot sequence ${sequence}`,
              tree,
              parents: [head],
            },
          );
          // 3) tag 指向该提交（实例从这里读目录字节）。
          gh(['api', '-X', 'POST', `repos/${repo}/git/refs`, '--input', '-'], {
            ref: `refs/tags/${tag}`,
            sha: commit,
          });
          // 4) 默认分支快进到同一提交：channels.json 必须在这里才被实例发现。
          //    force=false：并发发布时宁可失败，也不覆盖别人刚推进的指针。
          try {
            gh(['api', '-X', 'PATCH', `repos/${repo}/git/refs/heads/main`, '--input', '-'], {
              sha: commit,
              force: false,
            });
          } catch (error) {
            console.error(`::error::更新 channels.json 失败（默认分支已被推进？）：${error}`);
            console.error(`目录 tag ${tag} 已创建，但渠道指针未更新——请重跑本次发布。`);
            process.exit(1);
          }
          console.log(`已发布 ${tag}（commit ${commit}）并更新 channels.json`);
          NODE

      - name: 摘要
        run: |
          {
            echo "## 目录快照"
            echo
            echo "- sequence：${{ inputs.sequence }}"
            echo "- 真实密钥：${{ env.REAL_KEY }}"
            echo "- 发布：${{ inputs.publish }}"
          } >> "$GITHUB_STEP_SUMMARY"
