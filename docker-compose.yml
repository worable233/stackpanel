# StackPanel 默认部署档：一条命令起全栈（api + web + PostgreSQL + Redis + MinIO）。
#
#   bash scripts/deploy.sh
#
# 依赖服务（postgres/redis/minio）只在 compose 内网可见，不对外暴露端口；
# api/web 通过服务名连接它们。所有密钥由 scripts/deploy.sh 写入 docker/.env。
#
# 放大为真集群（外部 PG/Redis/对象存储 + 多副本 + LB）：见 docker-compose.cluster.yml。
#
# 手动：
#   cp docker/.env.example docker/.env   # 填密钥
#   docker compose --env-file docker/.env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackpanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stackpanel}
    volumes:
      - stackpanel-postgres:/var/lib/postgresql/data
    networks:
      - stackpanel
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stackpanel} -d ${POSTGRES_DB:-stackpanel}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - stackpanel-redis:/data
    networks:
      - stackpanel
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stackpanel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - stackpanel-minio:/data
    networks:
      - stackpanel
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: create the object-storage bucket once MinIO is healthy. The API
  # also ensures the bucket on boot; this makes it ready for first-run seeding.
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${STORAGE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stackpanel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-stackpanel}
    networks:
      - stackpanel

  # 一次性数据库迁移（ADR-0025）。在 api/worker/web 启动前跑完；失败则整体升级失败，
  # 不会留下「半个栈」运行在未知 schema 上。api 启动时不再自动迁移。
  migrate:
    build:
      context: .
      target: runtime
    image: ${STACKPANEL_IMAGE:-stackpanel-api:latest}
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/usr/local/bin/entrypoint-migrate']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stackpanel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stackpanel}
    networks:
      - stackpanel

  api:
    build:
      context: .
      target: runtime
    # 默认本地构建；发布版部署用 STACKPANEL_IMAGE 指向 GHCR 镜像（见 docker/README.md）。
    image: ${STACKPANEL_IMAGE:-stackpanel-api:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: ${API_MEM_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.5}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ['/usr/local/bin/entrypoint-api']
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-true}
      # Trust X-Forwarded-For only from the compose network (Caddy reverse proxy
      # / web BFF). External clients hitting the published API port are not in
      # this CIDR, so they cannot spoof it. Must match the pinned `stackpanel`
      # network subnet below.
      API_TRUST_PROXY: ${API_TRUST_PROXY:-172.28.0.0/16}
      DATABASE_URL: postgresql://${POSTGRES_USER:-stackpanel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stackpanel}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-stackpanel}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-stackpanel}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: ${JWT_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sp_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      STACKPANEL_SETUP_MODE: ${STACKPANEL_SETUP_MODE:-auto}
      STACKPANEL_SETUP_TOKEN: ${STACKPANEL_SETUP_TOKEN:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      STACKPANEL_SIGNING_PUBLIC_KEY: ${STACKPANEL_SIGNING_PUBLIC_KEY:-}
      PACKAGE_SIGNATURE_REQUIRED: ${PACKAGE_SIGNATURE_REQUIRED:-true}
      STACKPANEL_PLUGIN_MAX_OLD_SPACE_MB: ${STACKPANEL_PLUGIN_MAX_OLD_SPACE_MB:-256}
      # Per-plugin worker RSS ceiling (audit C-2); must stay below API_MEM_LIMIT.
      STACKPANEL_PLUGIN_MAX_RSS_MB: ${STACKPANEL_PLUGIN_MAX_RSS_MB:-512}
      STACKPANEL_PUBLIC_URL: ${STACKPANEL_PUBLIC_URL:-http://localhost:3000}
      STACKPANEL_API_PUBLIC_URL: ${STACKPANEL_API_PUBLIC_URL:-http://localhost:3001}
      STACKPANEL_DATA_DIR: /app/data
      WOWID_MOCK: 'false'
      WOWID_ISSUER: ${WOWID_ISSUER:-https://account.wowcraft.cn}
      WOWID_CLIENT_ID: ${WOWID_CLIENT_ID:-stackpanel}
      WOWID_CLIENT_SECRET: ${WOWID_CLIENT_SECRET:-}
      WOWID_REDIRECT_URI: ${WOWID_REDIRECT_URI:-}
      # ---- GitHub distribution & update centre (PLAN-github-distribution-and-updates) ----
      # Unset catalog repo => fully offline self-host (no outbound catalog requests).
      DISTRIBUTION_CATALOG_REPOSITORY: ${DISTRIBUTION_CATALOG_REPOSITORY:-}
      DISTRIBUTION_CATALOG_CHANNEL: ${DISTRIBUTION_CATALOG_CHANNEL:-stable}
      DISTRIBUTION_CATALOG_REF: ${DISTRIBUTION_CATALOG_REF:-main}
      DISTRIBUTION_CATALOG_TOKEN: ${DISTRIBUTION_CATALOG_TOKEN:-}
      DISTRIBUTION_CATALOG_MIRROR: ${DISTRIBUTION_CATALOG_MIRROR:-}
      DISTRIBUTION_CATALOG_PUBLIC_KEY: ${DISTRIBUTION_CATALOG_PUBLIC_KEY:-}
      STACKPANEL_MARKET_LOCAL_SOURCES: ${STACKPANEL_MARKET_LOCAL_SOURCES:-}
      # Docker target platform used to select the kernel image digest (linux/amd64, linux/arm64).
      DISTRIBUTION_DEPLOY_PLATFORM: ${DISTRIBUTION_DEPLOY_PLATFORM:-linux/amd64}
      # Update task channel shared with the updater's private volume.
      DISTRIBUTION_UPDATE_CHANNEL_DIR: ${DISTRIBUTION_UPDATE_CHANNEL_DIR:-/var/lib/stackpanel-updater/channel}
      DISTRIBUTION_UPDATE_INSTANCE_ID: ${UPDATER_INSTANCE_ID:-stackpanel}
      DISTRIBUTION_UPDATER_STATUS_FILE: ${DISTRIBUTION_UPDATER_STATUS_FILE:-/var/lib/stackpanel-updater/status.json}
    volumes:
      # Shared with web for plugin/theme frontend artifacts + the apply signal.
      - stackpanel-data:/app/data
      # Read/write: submit update tasks + read updater status projection.
      - stackpanel-updater-state:/var/lib/stackpanel-updater
    ports:
      # Published for host-side curl / external API clients. The browser never
      # needs it: every browser call goes through the web BFF on :3000.
      # Harden by binding to loopback (`127.0.0.1:3001:3001`) when no external
      # client must reach the kernel directly — this also keeps plain-HTTP API
      # traffic off the public interface.
      - '3001:3001'
    networks:
      - stackpanel
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      target: runtime
    # 与 api 同镜像（worker 走 worker 入口）；发布版用 STACKPANEL_IMAGE。
    image: ${STACKPANEL_IMAGE:-stackpanel-api:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    cpus: ${WORKER_CPU_LIMIT:-1.5}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ['/usr/local/bin/entrypoint-worker']
    environment:
      NODE_ENV: production
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-stackpanel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stackpanel}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-stackpanel}
      STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-stackpanel}
      STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: ${JWT_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      STACKPANEL_SIGNING_PUBLIC_KEY: ${STACKPANEL_SIGNING_PUBLIC_KEY:-}
      PACKAGE_SIGNATURE_REQUIRED: ${PACKAGE_SIGNATURE_REQUIRED:-true}
      STACKPANEL_PUBLIC_URL: ${STACKPANEL_PUBLIC_URL:-http://localhost:3000}
      STACKPANEL_API_PUBLIC_URL: ${STACKPANEL_API_PUBLIC_URL:-http://localhost:3001}
      STACKPANEL_DATA_DIR: /app/data
      # Background jobs (catalog refresh + auto-update) run on the worker.
      DISTRIBUTION_CATALOG_REPOSITORY: ${DISTRIBUTION_CATALOG_REPOSITORY:-}
      DISTRIBUTION_CATALOG_CHANNEL: ${DISTRIBUTION_CATALOG_CHANNEL:-stable}
      DISTRIBUTION_CATALOG_REF: ${DISTRIBUTION_CATALOG_REF:-main}
      DISTRIBUTION_CATALOG_TOKEN: ${DISTRIBUTION_CATALOG_TOKEN:-}
      DISTRIBUTION_CATALOG_MIRROR: ${DISTRIBUTION_CATALOG_MIRROR:-}
      DISTRIBUTION_CATALOG_PUBLIC_KEY: ${DISTRIBUTION_CATALOG_PUBLIC_KEY:-}
      STACKPANEL_MARKET_LOCAL_SOURCES: ${STACKPANEL_MARKET_LOCAL_SOURCES:-}
      DISTRIBUTION_DEPLOY_PLATFORM: ${DISTRIBUTION_DEPLOY_PLATFORM:-linux/amd64}
      DISTRIBUTION_UPDATE_CHANNEL_DIR: ${DISTRIBUTION_UPDATE_CHANNEL_DIR:-/var/lib/stackpanel-updater/channel}
      DISTRIBUTION_UPDATE_INSTANCE_ID: ${UPDATER_INSTANCE_ID:-stackpanel}
      DISTRIBUTION_UPDATER_STATUS_FILE: ${DISTRIBUTION_UPDATER_STATUS_FILE:-/var/lib/stackpanel-updater/status.json}
    volumes:
      # Plugin/theme packages (their frontends are loaded at runtime from here).
      - stackpanel-data:/app/data
      # Submit update tasks + read updater status projection.
      - stackpanel-updater-state:/var/lib/stackpanel-updater
    networks:
      - stackpanel

  web:
    build:
      context: .
      target: runtime
      args:
        API_BASE_URL: ${API_BASE_URL:-http://api:3001}
    # 发布版与 api 同镜像（runtime target 一致，API_BASE_URL 运行期注入）。
    image: ${STACKPANEL_IMAGE:-stackpanel-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ['/usr/local/bin/entrypoint-web']
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL:-http://api:3001}
      WEB_PORT: '3000'
      JWT_SECRET: ${JWT_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sp_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      # Canonical origin for SEO (canonical/hreflang/sitemap/og:url). Without it
      # the public site advertises http://localhost:3000 in machine-readable
      # output. Falls back to the configured public URL below.
      SITE_URL: ${STACKPANEL_PUBLIC_URL:-http://localhost:3000}
      # Browser-reachable API origin shown in copy-paste docs (API keys page).
      # The internal `API_BASE_URL` (http://api:3001) is not reachable by users.
      PUBLIC_API_BASE_URL: ${STACKPANEL_API_PUBLIC_URL:-${STACKPANEL_PUBLIC_URL:-http://localhost:3001}}
      STACKPANEL_DATA_DIR: /app/data
    volumes:
      - stackpanel-data:/app/data
    ports:
      - '3000:3000'
    networks:
      - stackpanel

  # 独立升级执行器（PLAN-github-distribution-and-updates §5.1）。默认档提供端到端自动
  # 升级能力：唯一持有 Docker socket，只操作本 Compose project，不依赖业务内核启动。
  # 用预构建镜像（apps/updater/Dockerfile），运行 Compose 不含 build。
  updater:
    build:
      context: .
      dockerfile: apps/updater/Dockerfile
      target: runtime
    image: ${STACKPANEL_UPDATER_IMAGE:-stackpanel-updater:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/usr/local/bin/entrypoint-updater']
    # updater 以非 root 的 `node` 用户运行，而 /var/run/docker.sock 属于
    # root:docker（GID 因宿主而异）。不加这个附加组时，所有 docker 调用都会
    # `permission denied while trying to connect to the Docker API`——升级必然
    # 失败（真机升级演练抓到）。`deploy.sh` 会把宿主的实际 GID 写进 docker/.env。
    group_add:
      - '${DOCKER_GID:-999}'
    environment:
      NODE_ENV: production
      UPDATER_STATE_DIR: /var/lib/stackpanel-updater
      UPDATER_INSTANCE_ID: ${UPDATER_INSTANCE_ID:-stackpanel}
      # updater 的 compose 工作目录是**共享的 project 目录**（挂载进容器），使其能对
      # 同一 project 执行 docker compose；Docker socket 提供操作能力。
      UPDATER_COMPOSE_PROJECT: /workspace
      UPDATER_COMPOSE_FILES: ${UPDATER_COMPOSE_FILES:-docker-compose.yml}
      # `--env-file`：updater 进程环境里没有 docker/.env 的密钥，缺了它 compose
      # 会把 ${POSTGRES_PASSWORD} / ${JWT_SECRET} 插值成空串，up -d 会用空密码
      # 重建 postgres，把实例锁死（真机升级演练抓到）。
      UPDATER_ENV_FILE: ${UPDATER_ENV_FILE:-docker/.env}
      UPDATER_IMAGE_REPOSITORY: ${STACKPANEL_IMAGE_REPOSITORY:-ghcr.io/worable233/stackpanel}
      UPDATER_IMAGE_ENV: STACKPANEL_IMAGE
      UPDATER_SERVICE_API: api
      UPDATER_SERVICE_WORKER: worker
      UPDATER_SERVICE_WEB: web
      # 一次性迁移服务（entrypoint-migrate + restart: "no"）。不能复用 api：
      # api 的 entrypoint 忽略 $@、直接起 server，迁移永不执行。
      UPDATER_SERVICE_MIGRATE: migrate
      UPDATER_DB_SERVICE: postgres
      UPDATER_DB_USER: ${POSTGRES_USER:-stackpanel}
      UPDATER_DB_NAME: ${POSTGRES_DB:-stackpanel}
      UPDATER_READINESS_URL: http://api:3001/health
      # 等待探针转绿的总预算：`up -d` 返回时 API 还在启动自检/连库/注册插件，
      # 单次探针会把正常升级误判为失败并回退（真机演练抓到）。
      UPDATER_READY_TIMEOUT_MS: ${UPDATER_READY_TIMEOUT_MS:-180000}
      UPDATER_POLL_INTERVAL_MS: ${UPDATER_POLL_INTERVAL_MS:-5000}
      # updater 自升级（§5.2）：切换自身服务镜像的环境变量，候选与回退都用它。
      UPDATER_SELF_SERVICE: updater
      UPDATER_SELF_IMAGE_ENV: STACKPANEL_UPDATER_IMAGE
      # 自升级候选必须落在 **updater 自己的仓库**，不是内核仓库。留空时由当前
      # 运行镜像引用推导（`repo:tag` / `repo@sha256:...` → `repo`）。
      UPDATER_SELF_IMAGE_REPOSITORY: ${UPDATER_SELF_IMAGE_REPOSITORY:-}
      # 独立恢复入口（§5.2）：仅在配置令牌与端口时监听；默认只回环，不进 compose 网络。
      UPDATER_RECOVERY_TOKEN: ${UPDATER_RECOVERY_TOKEN:-}
      UPDATER_RECOVERY_PORT: ${UPDATER_RECOVERY_PORT:-0}
      UPDATER_RECOVERY_HOST: ${UPDATER_RECOVERY_HOST:-127.0.0.1}
    volumes:
      # 唯一持有 Docker socket 的进程（§5.1）。
      - /var/run/docker.sock:/var/run/docker.sock
      # 只读挂载 project 目录，使其能对绑定 project 执行 docker compose。
      - ./:/workspace:ro
      # updater 独立持久卷：权威日志、锁、部署指针、备份。
      - stackpanel-updater-state:/var/lib/stackpanel-updater
    networks:
      - stackpanel

  # Optional: automatic HTTPS reverse proxy. Enabled via `--profile https`
  # (scripts/deploy.sh does this when --domain is given). Binds 80/443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['https']
    depends_on:
      - web
    environment:
      STACKPANEL_DOMAIN: ${STACKPANEL_DOMAIN:-localhost}
      STACKPANEL_EMAIL: ${STACKPANEL_EMAIL:-}
      # CDN / external LB egress CIDRs. Empty = trust no proxy (correct when
      # Caddy terminates client connections directly).
      STACKPANEL_TRUSTED_PROXIES: ${STACKPANEL_TRUSTED_PROXIES:-}
      WEB_UPSTREAM: web:3000
      API_UPSTREAM: api:3001
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - stackpanel

volumes:
  stackpanel-data:
  stackpanel-postgres:
  stackpanel-redis:
  stackpanel-minio:
  stackpanel-updater-state:
  caddy-data:
  caddy-config:

networks:
  stackpanel:
    # Fixed subnet so the kernel can trust forwarded client-IP headers from the
    # in-network reverse proxy (Caddy) without trusting arbitrary peers. The
    # `api` service defaults `API_TRUST_PROXY` to this CIDR; if you change the
    # subnet here, update that variable to match.
    ipam:
      config:
        - subnet: 172.28.0.0/16
