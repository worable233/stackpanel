packages:
  - apps/*
  - packages/*
  - packages/plugins/*

# pnpm 11: allowBuilds replaces onlyBuiltDependencies/ignoredBuiltDependencies.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: false
  unrs-resolver: false
  better-sqlite3: true
  msgpackr-extract: true
  # OTel OTLP HTTP exporter transitively pulls protobufjs; its postinstall only
  # generates .proto artifacts we don't use, so keep it from running.
  protobufjs: false

minimumReleaseAgeExclude:
  - '@types/semver@7.8.0'
  - bullmq@6.3.10

overrides:
  zod@3.24.1: 3.25.71
  postcss: 8.5.25
  sharp: 0.35.0
