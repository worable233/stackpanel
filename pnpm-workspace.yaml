packages:
  - apps/*
  - packages/*
  - packages/plugins/*

# pnpm 11: allowBuilds replaces onlyBuiltDependencies/ignoredBuiltDependencies.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: false
  unrs-resolver: false
  better-sqlite3: true
  msgpackr-extract: true
  # OTel OTLP HTTP exporter transitively pulls protobufjs; its postinstall only
  # generates .proto artifacts we don't use, so keep it from running.
  protobufjs: false

minimumReleaseAgeExclude:
  - '@types/semver@7.8.0'
  - bullmq@6.3.10

overrides:
  zod@3.24.1: 3.25.71
  postcss: 8.5.25
  sharp: 0.35.5
  '@fastify/swagger>fast-uri': 3.1.8
  fast-uri: 3.1.8
  ip-address: 10.7.3
  undici: 7.29.1
  js-yaml: 4.3.2
  deepmerge-ts: 8.0.2
  mysql2: 3.24.5
  basic-ftp: 6.2.2
  proxy-addr: 2.0.8
  brace-expansion@1.1.18: 1.1.20
  brace-expansion@2.1.4: 2.1.6
  brace-expansion@5.0.9: 5.0.12
  semver@4.3.6: 7.8.5
  semver@5.5.0: 7.8.5
